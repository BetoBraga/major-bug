<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Major Bug</title><script>
(async () => {
  let lang = "en";
  try {
    const response = await fetch("https://ipapi.co/country/", {signal: AbortSignal.timeout(1000), referrerPolicy:"no-referrer"});
    if (response.ok && (await response.text()).trim().toUpperCase() === "BR") lang = "pt-br";
  } catch {}
  location.replace("./" + lang + "/");
})();
</script><body><p><a href="./en/">Read Major Bug in English</a> · <a href="./pt-br/">Ler em português</a></p>
<p>Automatic language selection uses country-level IP lookup via ipapi.co.</p></body></html>
